notes: >-
  Idoven's Willem platform is a CE-marked Class IIa medical device (EU MDR). The
  company publishes an extensive certification program and supports established
  healthcare interoperability formats. The Willem API host
  (https://willem-api.idoven.ai/doc) returns HTTP 451 to US-origin requests
  (EU-geoblocked), so the OpenAPI-derived cross-cutting standards (oauth2, rfc9457,
  pagination, idempotency) could not be verified and are omitted rather than assumed.
