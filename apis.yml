aid: idoven
name: IDOVEN
description: >-
  Idoven builds artificial-intelligence solutions for cardiovascular care. Its flagship
  platform, Willem, is a CE-marked Class IIa medical device that analyzes electrocardiograms
  (ECGs) to detect, diagnose, and monitor cardiac disease, identifying 22 cardiac patterns
  and 4 intervals across ambulatory devices, diagnostic ECGs, and insertable cardiac monitors.
  Idoven serves MedTech companies, Life Sciences (cardiotoxicity monitoring and disease-risk
  scoring for pharma trials), and preventative remote-screening programs. The Willem API
  supports bi-directional data exchange in EDF, HL7, DICOM, JSON, XML, and PDF. The company
  is headquartered in Spain, holds an extensive ISO and IEC certification program, and is
  backed by Insight Partners and Northzone. Sector: healthcare / cardiology AI.
